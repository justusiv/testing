<style rel="stylesheet" crossorigin>
  :root {
    --bg-color: #1a1a1a;
    --frame-bg: #2a2a2a;
    --health-good: #2ecc71;
    --health-medium: #f1c40f;
    --health-low: #e74c3c;
    --mana-color: #3498db;
    --border-color: #444;
    --highlight-color: #f39c12;
    --bg-panel: #2d2d2d;
    --text-primary: #ffffff;
    --text-secondary: #b3b3b3
  }

  * {
    box-sizing: border-box
  }

  body {
    margin: 0;
    background-color: var(--bg-color);
    color: #fff;
    font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden
  }

  #game-container {
    display: flex;
    flex-direction: row;
    gap: 10px;
    width: 100vw;
    height: 100vh;
    padding: 10px;
    overflow: hidden
  }

  #main-content {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 10px;
    overflow: hidden
  }

  .raid-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    padding: 5px;
    background: #222;
    border-radius: 8px;
    flex-grow: 1;
    position: relative
  }

  .raid-frame {
    background: var(--frame-bg);
    border: 2px solid var(--border-color);
    border-radius: 4px;
    position: relative;
    cursor: pointer;
    height: 60px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    transition: border-color .1s
  }

  .raid-frame.selected {
    border-color: var(--highlight-color);
    box-shadow: 0 0 5px var(--highlight-color)
  }

  .raid-frame.dead {
    opacity: .5;
    filter: grayscale(100%)
  }

  .frame-name {
    position: absolute;
    top: 2px;
    left: 5px;
    z-index: 2;
    font-size: 11px;
    text-shadow: 1px 1px 2px black;
    pointer-events: none
  }

  .health-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
    font-size: 12px;
    font-weight: bold;
    color: white;
    text-shadow: 1px 1px 2px black;
    pointer-events: none;
    display: none;
  }

  .health-text.visible {
    display: block;
  }

  .health-bar {
    height: 100%;
    width: 100%;
    background-color: var(--health-good);
    transition: width .2s, background-color .2s;
    position: absolute;
    bottom: 0;
    left: 0;
    z-index: 1
  }

  .buff-container {
    position: absolute;
    bottom: 2px;
    right: 2px;
    display: flex;
    gap: 2px;
    z-index: 3
  }

  .buff-icon {
    width: 10px;
    height: 10px;
    background-color: #2ecc71;
    border-radius: 50%;
    border: 1px solid white
  }

  .debuff-icon {
    width: 10px;
    height: 10px;
    background-color: #f0f;
    border: 1px solid white
  }

  #player-hud {
    background: #222;
    padding: 10px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0
  }

  .resource-bar-container,
  .cast-bar-container {
    height: 20px;
    background: #111;
    border-radius: 4px;
    position: relative;
    overflow: hidden
  }

  .resource-bar,
  .cast-bar {
    height: 100%;
    width: 100%;
    position: relative
  }

  .bar-fill {
    height: 100%;
    width: 100%;
    transition: width .1s linear
  }

  #mana-bar .bar-fill {
    background-color: var(--mana-color)
  }

  #cast-bar .bar-fill {
    background-color: #f1c40f
  }

  .bar-text {
    position: absolute;
    width: 100%;
    text-align: center;
    line-height: 20px;
    z-index: 2;
    text-shadow: 1px 1px 2px black;
    font-size: 12px
  }

  .hidden {
    opacity: 0
  }

  .spell-bar {
    display: flex;
    gap: 5px;
    justify-content: center;
    margin-top: 5px
  }

  .spell-btn {
    width: 45px;
    height: 45px;
    background: #444;
    border: 2px solid #666;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    position: relative
  }

  .spell-btn:hover {
    border-color: #fff
  }

  .spell-btn.cooldown {
    cursor: not-allowed
  }

  .cooldown-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 4px;
    pointer-events: none;
    z-index: 5
  }

  .cooldown-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    text-shadow: 1px 1px 3px black;
    z-index: 6;
    pointer-events: none
  }

  .keybind {
    position: absolute;
    top: 1px;
    right: 1px;
    color: #f1c40f;
    font-weight: 700;
    z-index: 7;
    font-size: 10px
  }

  .stats-panel {
    margin-top: 5px;
    padding: 5px;
    background: #1a1a1a;
    border-radius: 4px;
    display: flex;
    gap: 15px;
    justify-content: space-around
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px
  }

  .stat-label {
    font-size: 10px;
    color: #888;
    text-transform: uppercase
  }

  .stat-value {
    font-size: 14px;
    font-weight: 700;
    color: #2ecc71
  }

  .shield-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 0%;
    width: 100%;
    background: #ffffff4d;
    border-top: 2px solid white;
    pointer-events: none;
    z-index: 2;
    transition: height .2s;
    display: none
  }

  .shield-overlay.active {
    display: block
  }

  #game-over-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000c;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    color: #fff;
    font-size: 32px;
    font-weight: 700
  }

  #game-over-overlay.hidden {
    display: none
  }

  .restart-btn {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 18px;
    background: var(--health-good);
    border: none;
    border-radius: 4px;
    color: #fff;
    cursor: pointer
  }

  .restart-btn:hover {
    background: #27ae60
  }

  .floating-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 20px;
    font-weight: 700;
    pointer-events: none;
    z-index: 10;
    animation: floatUp 1s ease-out forwards;
    text-shadow: 1px 1px 2px black
  }

  .floating-text.heal {
    color: #2ecc71
  }

  .floating-text.damage {
    color: #e74c3c
  }

  @keyframes floatUp {
    0% {
      opacity: 1;
      margin-top: 0
    }

    to {
      opacity: 0;
      margin-top: -50px
    }
  }

  #chain-heal-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100
  }

  .chain-beam {
    stroke: #2ecc71;
    stroke-width: 3;
    fill: none;
    filter: drop-shadow(0 0 5px #2ecc71);
    stroke-dasharray: 10 5;
    animation: chainFlow .6s linear
  }

  @keyframes chainFlow {
    0% {
      stroke-dashoffset: 0;
      opacity: 0
    }

    20% {
      opacity: 1
    }

    to {
      stroke-dashoffset: -100;
      opacity: 0
    }
  }

  .chain-heal-glow {
    box-shadow: 0 0 20px #2ecc71, inset 0 0 20px #2ecc71;
    animation: chainGlow .6s ease-out
  }

  @keyframes chainGlow {
    0% {
      box-shadow: 0 0 20px #2ecc71, inset 0 0 20px #2ecc71
    }

    to {
      box-shadow: 0 0 #2ecc71, inset 0 0 #2ecc71
    }
  }

  .settings-panel {
    margin-top: 5px;
    display: flex;
    justify-content: center
  }

  .toggle-switch {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }

  .slider {
    position: relative;
    width: 50px;
    height: 28px;
    background-color: #ccc;
    transition: .4s;
    border-radius: 34px;
    flex-shrink: 0;
  }

  .slider:before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 4px;
    bottom: 4px;
    background-color: #fff;
    transition: .4s;
    border-radius: 50%
  }

  input:checked+.slider {
    background-color: #2196f3
  }

  input:focus+.slider {
    box-shadow: 0 0 1px #2196f3
  }

  input:checked+.slider:before {
    transform: translate(22px)
  }

  .label-text {
    color: #fff;
    font-weight: 700;
    white-space: nowrap;
    font-size: 12px
  }

  #dps-meter {
    width: 250px;
    background-color: var(--bg-panel);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 6px #0000004d;
    flex-shrink: 0
  }

  .dps-meter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    border-bottom: 1px solid #444;
    padding-bottom: 5px
  }

  .dps-meter-header span:first-child {
    font-weight: 700;
    color: var(--text-secondary)
  }

  .total-dps {
    font-weight: 700;
    color: var(--text-primary)
  }

  #dps-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    flex: 1
  }

  .dps-item {
    display: flex;
    flex-direction: column;
    font-size: .85rem;
    position: relative;
    padding: 2px 0
  }

  .dps-player-info {
    display: flex;
    justify-content: space-between;
    z-index: 2;
    margin-bottom: 2px
  }

  .dps-value {
    position: absolute;
    right: 5px;
    top: 2px;
    z-index: 2;
    font-weight: 700
  }

  .dps-bar-container {
    height: 6px;
    width: 100%;
    background-color: #333;
    border-radius: 3px;
    overflow: hidden
  }

  .dps-bar {
    height: 100%;
    background-color: #7f8c8d;
    transition: width .5s ease-out
  }

  .boss-health-container {
    background-color: var(--bg-panel);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 5px;

  }

  .boss-name {
    font-size: 1.2rem;
    font-weight: 700;
    text-align: center;

    text-shadow: 2px 2px 4px rgba(0, 0, 0, .8);
    letter-spacing: 2px
  }

  .boss-health-bar {
    width: 100%;
    height: 25px;
    background-color: #444;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    border: 2px solid #666
  }

  .boss-health-bar .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #c0392b, #e74c3c);
    width: 100%;

  }

  .boss-health-bar .bar-fill.medium {
    background: linear-gradient(90deg, #d35400, #e67e22)
  }

  .boss-health-bar .bar-fill.low {
    background: linear-gradient(90deg, #f39c12, #f1c40f)
  }

  .boss-health-bar .bar-text {
    position: absolute;

    width: 100%;

    display: flex;

    font-size: 1rem;
    font-weight: 700;

  }

  .boss-enrage-indicator {
    text-align: center;
    margin-top: 5px;

    font-weight: 700;

  @keyframes pulse {

  <div id="app">
    <div id="game-container">
      <div id="main-content">
        <div id="boss-health-container" class="boss-health-container">
          <div class="boss-name">Shadow Lord Malgath</div>
          <div id="boss-health-bar" class="boss-health-bar">
            <span id="boss-health-text" class="bar-text">100%</span>
            <div id="boss-health-fill" class="bar-fill" style="width: 100%"></div>
          </div>
          <div id="boss-enrage-indicator" class="boss-enrage-indicator hidden">ENRAGED!</div>
        </div>
        <div id="raid-frames" class="raid-grid">
          <!-- Raid frames will be injected here -->
        </div>
        <svg id="chain-heal-overlay" xmlns="http://www.w3.org/2000/svg">
          <!-- Chain heal beams will be drawn here -->
        </svg>

        <div id="player-hud">
          <div class="resource-bar-container">
            <div id="mana-bar" class="resource-bar">
              <span class="bar-text">Mana: 100%</span>
              <div class="bar-fill" style="width: 100%"></div>
            </div>
          </div>

          <div class="cast-bar-container">
            <div id="cast-bar" class="cast-bar hidden">
              <span id="cast-name" class="bar-text">Casting...</span>
              <div id="cast-fill" class="bar-fill" style="width: 0%"></div>
            </div>
          </div>

          <div id="spell-bar" class="spell-bar">
            <!-- Spells will be injected here -->
          </div>

          <div id="stats-panel" class="stats-panel">
            <div class="stat-item">
              <span class="stat-label">Healing:</span>
              <span id="stat-healing" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Overheal:</span>
              <span id="stat-overheal" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Overheal %:</span>
              <span id="stat-overheal-pct" class="stat-value">0%</span>
            </div>
          </div>

          <div class="settings-panel">
            <label class="toggle-switch">
              <input type="checkbox" id="mouseover-toggle" checked>
              <span class="slider"></span>
              <span class="label-text">Mouse-Over Mode</span>
            </label>
            <label class="toggle-switch" style="margin-left: 10px;">
              <input type="checkbox" id="health-text-toggle" checked>
              <span class="slider"></span>
              <span class="label-text">Show Health Text</span>
            </label>
          </div>
        </div>
      </div>

      <div id="dps-meter" class="dps-meter">
        <div class="dps-meter-header">
          <span>DPS Meter</span>
          <span id="total-raid-dps" class="total-dps">0</span>
        </div>
        <div id="dps-list" class="dps-list">
          <!-- Top DPS players will be injected here -->
        </div>
      </div>
    </div>
    <div id="game-over-overlay" class="hidden">
      <div>GAME OVER</div>
      <button class="restart-btn" onclick="location.reload()">Try Again</button>
    </div>
  </div>
</body>

</html>
